  <rect width="1160" height="720" fill="#fffaf0"/><rect x="255" y="25" width="650" height="75" rx="14" fill="#17140f"/><text x="580" y="56" text-anchor="middle" class="h" fill="#fffaf0">AndreaGPT · router decisionale locale</text><text x="580" y="79" text-anchor="middle" class="s" fill="#fffaf0">Decisioni tipizzate e confidenza senza API, account o costi</text>
