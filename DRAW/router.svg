<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
  <title id="title">Router decisionale locale di AndreaGPT</title><desc id="desc">Un motore locale sceglie fra chat normale, Brain privato e ricerca siti Web con SearXNG, usando punteggi, confidenza e fallback.</desc>
