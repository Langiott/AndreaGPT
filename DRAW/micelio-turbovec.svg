<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="title desc">
  <title id="title">Flusso Micelio e TurboVec</title><desc id="desc">La domanda attraversa Micelio, TurboVec e il modello per produrre la risposta.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#736850"/></marker></defs>
  <rect width="1000" height="190" rx="18" fill="#fffaf0" stroke="#d7ccb8"/>
  <g font-family="Arial, sans-serif" text-anchor="middle"><g fill="none" stroke="#736850" stroke-width="3" marker-end="url(#arrow)"><path d="M225 95H285"/><path d="M475 95H535"/><path d="M725 95H785"/></g><g stroke-width="2"><rect x="35" y="46" width="190" height="98" rx="15" fill="#e1f2d4" stroke="#78945f"/><rect x="285" y="46" width="190" height="98" rx="15" fill="#f5e7c9" stroke="#a88448"/><rect x="535" y="46" width="190" height="98" rx="15" fill="#e5e8f6" stroke="#747da7"/><rect x="785" y="46" width="180" height="98" rx="15" fill="#efe1d7" stroke="#a27259"/></g><g fill="#201c16"><text x="130" y="84" font-size="22" font-weight="700">Domanda</text><text x="130" y="113" font-size="14">linguaggio naturale</text><text x="380" y="84" font-size="22" font-weight="700">Micelio</text><text x="380" y="113" font-size="14">seleziona le aree</text><text x="630" y="84" font-size="22" font-weight="700">TurboVec</text><text x="630" y="113" font-size="14">trova gli estratti</text><text x="875" y="84" font-size="22" font-weight="700">Modello</text><text x="875" y="113" font-size="14">genera la risposta</text></g></g>
</svg>
