services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: andreagpt-searxng
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  scrapling:
    build:
      context: ./scrapling
    container_name: andreagpt-scrapling
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: andreagpt-n8n
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      GENERIC_TIMEZONE: Europe/Rome
      TZ: Europe/Rome
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      WEBHOOK_URL: http://127.0.0.1:5678/
    volumes:
      - n8n-data:/home/node/.n8n

  andreagpt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: andreagpt
    restart: unless-stopped
    # init inoltra SIGTERM a Node (chiusura ordinata dei worker Python); 30 s per chiudere un'indicizzazione.
    init: true
    stop_grace_period: 30s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_DOCKER_HOST: "1"
      LAN_ACCESS: ${LAN_ACCESS:-0}
      COMFYUI_URL: http://host.docker.internal:8188
      BRAIN_EMBED_BATCH: ${BRAIN_EMBED_BATCH:-32}
      BRAIN_EMBED_CONCURRENCY: ${BRAIN_EMBED_CONCURRENCY:-3}
      BRAIN_TURBOVEC: ${BRAIN_TURBOVEC:-1}
      BRAIN_RETRIEVAL_BACKEND: ${BRAIN_RETRIEVAL_BACKEND:-sqlite}
      BRAIN_PCA_DIM: ${BRAIN_PCA_DIM:-768}
      BRAIN_VECTOR_CANDIDATES: ${BRAIN_VECTOR_CANDIDATES:-96}
      CODE_WORKSPACE: ${CODE_WORKSPACE:-/app/backend}
      RAG_OPTIMIZE: ${RAG_OPTIMIZE:-1}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      HF_HOME: /app/data/huggingface
      BRAIN_ROOT: /app/ANDREA-BRAIN
      BRAIN_DATA_DIR: /app/ANDREA-BRAIN/.index
      OCR_ROOT: /app/OCR
      OUTPUT_ROOT: /app/OUTPUT
      DIAGNOSTICS_DIR: /app/OUTPUT/Log
      IMAGE_DEVICE: ${IMAGE_DEVICE:-auto}
      VISION_PYTHON: /opt/doctr/bin/python
      VISION_MODEL: ${VISION_MODEL:-Qwen/Qwen3-VL-2B-Instruct}
      VISION_DEVICE: ${VISION_DEVICE:-auto}
      VISION_MAX_PIXELS: ${VISION_MAX_PIXELS:-262144}
      VISION_MAX_TOKENS: ${VISION_MAX_TOKENS:-256}
      TESSERACT_LANG: ita+eng
      OCR_ENGINE: doctr
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_API_BASE: ${NVIDIA_API_BASE:-https://integrate.api.nvidia.com/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY:-}
      LOCAL_ROUTER_ENABLED: ${LOCAL_ROUTER_ENABLED:-1}
      LOCAL_ROUTER_THRESHOLD: ${LOCAL_ROUTER_THRESHOLD:-0.75}
      SEARXNG_URL: http://searxng:8080
      SCRAPLING_URL: http://scrapling:8090
      N8N_URL: http://n8n:5678
      N8N_API_KEY: ${N8N_API_KEY:-}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CANDIDATURE_MODEL: ${CANDIDATURE_MODEL:-qwen2.5-coder:7b}
      CANDIDATURE_SOGLIA: ${CANDIDATURE_SOGLIA:-0.62}
      INSTAGRAM_SESSIONID: ${INSTAGRAM_SESSIONID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./ANDREA-BRAIN:/app/ANDREA-BRAIN
      - tools-data:/app/data/tools
      - model-cache:/app/data/huggingface
      - ./OCR:/app/OCR
      - ./OUTPUT:/app/OUTPUT
    depends_on:
      searxng:
        condition: service_healthy
      scrapling:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  n8n-data:
  tools-data:
  model-cache:
